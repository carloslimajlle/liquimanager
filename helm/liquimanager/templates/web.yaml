{{- $sel := dict "root" . "component" "web" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lqm.fullname" . }}-web
  labels:
    {{- include "lqm.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "lqm.selectorLabels" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lqm.labels" . | nindent 8 }}
        {{- include "lqm.selectorLabels" $sel | nindent 8 }}
      {{- with .Values.web.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "lqm.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- include "lqm.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: web
          image: {{ include "lqm.image" (dict "root" . "image" .Values.web.image) | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          env:
            # Onde o Nginx encontra a API. O navegador so fala com este servidor: /api e repassado.
            - name: LQM_API_URL
              value: {{ printf "http://%s-api:%v" (include "lqm.fullname" .) .Values.service.apiPort | quote }}
            - name: LQM_OIDC_AUTHORITY
              value: {{ ternary .Values.oidc.issuerUri "" .Values.oidc.enabled | quote }}
            - name: LQM_OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 20
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lqm.fullname" . }}-web
  labels:
    {{- include "lqm.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "lqm.selectorLabels" $sel | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.webPort }}
      targetPort: http
