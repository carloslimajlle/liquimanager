{{- include "lqm.validate" . -}}
{{- if and (not .Values.database.existingSecret) .Values.database.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lqm.dbSecretName" . }}
  labels:
    {{- include "lqm.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.database.username | quote }}
  password: {{ .Values.database.password | quote }}
{{- end }}
{{- if and (eq .Values.storage.type "s3") (not .Values.storage.s3.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lqm.s3SecretName" . }}
  labels:
    {{- include "lqm.labels" . | nindent 4 }}
type: Opaque
stringData:
  accessKey: {{ .Values.storage.s3.accessKey | quote }}
  secretKey: {{ .Values.storage.s3.secretKey | quote }}
{{- end }}
