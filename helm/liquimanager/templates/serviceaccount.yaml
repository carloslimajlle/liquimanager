{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lqm.serviceAccountName" . }}
  labels:
    {{- include "lqm.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Nenhum componente do LiquiManager fala com a API do Kubernetes.
automountServiceAccountToken: false
{{- end }}
