# Two replicas of the API, to exercise what a deployment with more than one needs (docs/04 § "Mais de uma réplica"):
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.ha.yml up -d --build api api2 minio
#
# What is shared: the database (jobs take a lock there, ShedLock; the live feed and the secret-cache eviction travel over Postgres
# LISTEN/NOTIFY) and the object storage (a log written by one replica is read by the other). Without `lqm.storage.type=s3`
# each replica would keep its logs in its own directory and the other could not open them.
#
# It combines with deploy/docker-compose.oidc.yml. Put a load balancer in front for the real thing; here api is on 8080 and api2 on 8083.
x-storage: &storage
  LQM_STORAGE_TYPE: s3
  LQM_STORAGE_S3_ENDPOINT: http://minio:9000
  LQM_STORAGE_S3_ACCESS_KEY: lqm
  LQM_STORAGE_S3_SECRET_KEY: lqmlqmlqm

services:
  api:
    depends_on:
      minio:
        condition: service_healthy
    environment:
      <<: *storage

  api2:
    build:
      context: ..
      dockerfile: lqm-api/Dockerfile
    container_name: lqm-api2
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      <<: *storage
      LQM_DB_URL: jdbc:postgresql://postgres:5432/lqm
      LQM_JOBS_ENABLED: ${LQM_JOBS_ENABLED:-true}
    ports:
      - "8083:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
