databaseChangeLog:
  - changeSet:
      id: 003-create-produto
      author: carlos
      comment: Catalogo de produtos (independente do cliente e do pedido)
      changes:
        - createTable:
            tableName: produto
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: sku
                  type: VARCHAR(40)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: nome
                  type: VARCHAR(160)
                  constraints:
                    nullable: false
              - column:
                  name: preco
                  type: NUMERIC(14,2)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: produto
