# LiquiManager local development environment.
#
#   docker compose -f deploy/docker-compose.yml up -d
#   docker compose -f deploy/docker-compose.yml --profile target up -d   # + test SQL Server
#
# Nothing here reaches another environment: the passwords are weak on purpose and
# sit in plain text because they are local and disposable. In DEV/HML/PRD the
# credentials come from the secrets provider (D-04: Vault).

name: liquimanager

services:
  # LiquiManager's own database (D-01).
  postgres:
    image: postgres:16-alpine
    container_name: lqm-postgres
    environment:
      POSTGRES_DB: lqm
      POSTGRES_USER: lqm
      POSTGRES_PASSWORD: lqm
      # Determinism: Liquibase writes timestamptz in UTC (RNF-12).
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lqm -d lqm"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The API (Spring Boot). It applies its own schema on startup (Liquibase, `seed` context).
  # No OIDC issuer is set here, so user endpoints run on the development chain:
  # any call is allowed and X-LQM-User acts as that user (see deploy/README for Keycloak).
  api:
    build:
      context: ..
      dockerfile: lqm-api/Dockerfile
    container_name: lqm-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LQM_DB_URL: jdbc:postgresql://postgres:5432/lqm
      # Jobs (drift, metrics, scanner, notifications) run in this process by default. With the `worker` profile they move
      # to their own container: set LQM_JOBS_ENABLED=false here and start it (see `worker` below).
      LQM_JOBS_ENABLED: ${LQM_JOBS_ENABLED:-true}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # The jobs on their own (D-20): the same image as the API, with nothing published. ShedLock keeps two copies from running
  # the same job, so it can be scaled. Remember `LQM_JOBS_ENABLED=false` on the API, or both run them.
  #   LQM_JOBS_ENABLED=false docker compose -f deploy/docker-compose.yml --profile worker up -d
  # The SPA behind Nginx, as it ships (lqm-web/Dockerfile): one image, configured when it starts. /api is proxied to the API, so the
  # browser talks to one address. With an identity provider, set LQM_OIDC_AUTHORITY (e.g. http://localhost:8081/realms/liquimanager).
  #   docker compose -f deploy/docker-compose.yml --profile web up -d --build web      -> http://localhost:8088
  web:
    profiles: ["web"]
    build:
      context: ..
      dockerfile: lqm-web/Dockerfile
    container_name: lqm-web
    depends_on:
      - api
    environment:
      LQM_API_URL: http://api:8080
      LQM_OIDC_AUTHORITY: ${LQM_OIDC_AUTHORITY:-}
      LQM_OIDC_CLIENT_ID: ${LQM_OIDC_CLIENT_ID:-lqm-web}
    ports:
      - "8088:80"

  worker:
    profiles: ["worker"]
    build:
      context: ..
      dockerfile: lqm-api/Dockerfile
    container_name: lqm-worker
    depends_on:
      api:
        condition: service_healthy
    environment:
      LQM_DB_URL: jdbc:postgresql://postgres:5432/lqm
      LQM_JOBS_ENABLED: "true"

  # SSO (D-03). The `liquimanager` realm is imported from the version-controlled file.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: lqm-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  # Object storage for logs and reports (D-09).
  minio:
    # MinIO's community image was withdrawn from the registries; RustFS is S3-compatible
    # and keeps the same ports and credentials, so nothing downstream changes.
    image: rustfs/rustfs:latest
    container_name: lqm-minio
    environment:
      RUSTFS_ACCESS_KEY: lqm
      RUSTFS_SECRET_KEY: lqmlqmlqm
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # TARGET test database: stands in for a Core so collection and drift can be
  # exercised. Behind a profile because it eats ~2 GB of RAM and is rarely needed.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: lqm-sqlserver
    profiles: ["target"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Lqm!Local123"
      MSSQL_PID: Developer
      # SQL Server takes all the memory it is offered; with GitLab and Keycloak beside it, that is too much.
      MSSQL_MEMORY_LIMIT_MB: "1536"
    ports:
      - "1433:1433"

  # Vault in dev mode (in memory, unsealed, root token "lqm-dev-root"): stands in for the corporate Vault so the VAULT secret
  # provider, token and AppRole logins can be exercised. Never for real secrets. See deploy/vault/README.md.
  vault:
    image: hashicorp/vault:1.18
    container_name: lqm-vault
    profiles: ["vault"]
    cap_add: ["IPC_LOCK"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: lqm-dev-root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"

volumes:
  pgdata:
  miniodata:
